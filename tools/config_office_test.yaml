# Конфиг автопусконаладки — ТЕСТОВЫЙ ОБЪЕКТ «офис» (репетиция воронежского сценария).
#
# Зачем: прогнать на живом железе офиса тот же порядок работ, что запланирован для школы №45
# (имена по карте → группы → кросс-группы → пространства), пока объект под рукой.
# Паркеты — tools/office_test/parquet/ (архив office_parcet.zip от пользователя).
#
# ⚠ Объект НАМЕРЕННО содержит кросс-шлюзовые случаи: зона 103_2 = лампы линий 1.2 и 1.3,
# общая группа помещения 103_Дверь = лампы линий 1.1 + 1.2 + 1.3 (три контроллера).

ha:
  url: "ws://localhost:8123/api/websocket"

general_groups:
  create: true               # общие группы помещений — часть проверяемого сценария
  skip_if_single_zone: false  # ⚠ 2026-08-12: общая группа нужна КАЖДОМУ пространству,
                             #   даже если зона в нём одна — общими группами управляет
                             #   СТОРОННЯЯ интеграция (ярлык `ba_area_light`), и
                             #   пространство без общей группы для неё дыра.
                             # (у 101_Окно и 102_Кондиционер по одной зоне → общей не будет)

areas:
  assign_general: true       # область общим группам
  assign_zone: true          # и зонным тоже (решение 2026-08-10)
  create_missing: false      # ⚠ на тесте области НЕ создаём: сначала смотрим, каких нет,
                             #   и заводим руками — так же, как решено для Воронежа

# ⛔ Автояркость — ВЫКЛЮЧЕНА (как в config_voronezh.yaml): настраивает пользователь.
autobrightness:
  by_space_type: {}
  exclude_spaces: []
  exclude_floors: []

# ⛔ Привязки кнопок — ВЫКЛЮЧЕНЫ: настраивает пользователь.
panels:
  layout: {}
