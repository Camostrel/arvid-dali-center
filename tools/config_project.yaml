# config_project.yaml — параметры автоматической пусконаладки объекта.
# Правится РУКАМИ (коллега потом сделает UF-заполнение). Значения — дефолтные, меняй под объект.
#
# Как применить: правишь этот файл → генеришь скрипт:
#   python3 import_project.py emit --normalized <parquet> --config config_project.yaml --out apply.py
# Параметры отсюда ВШИВАЮТСЯ в apply.py. Токен HA в конфиг НЕ кладём — только через env HA_TOKEN.
#
# Список ДОСТУПНЫХ действий/целей/типов помещений (для UI коллеги):
#   python3 import_project.py caps --normalized <parquet>

# ── Подключение к HA (вшивается в скрипт как адрес по умолчанию) ──────────────
ha:
  # localhost — если запускаешь на самом боксе (проверено). Не достучался из аддона —
  # попробуй  ws://homeassistant:8123/api/websocket  или  ws://<IP бокса>:8123/api/websocket
  url: "ws://localhost:8123/api/websocket"

# ── Общие группы (помещение целиком) ─────────────────────────────────────────
general_groups:
  create: true              # делать ли реальные DALI-группы «всё помещение» (едят слот из 16)
  skip_if_single_zone: true # помещение из ОДНОЙ зоны → общая = зона, отдельный слот не тратим

# ── Пространства HA (area) для групп ─────────────────────────────────────────
# Назначать HA-area ТОЛЬКО общим группам помещений (решение пользователя). Area ищется в HA
# по ИМЕНИ = имя помещения (`space`, напр. «103_Вестибюль»). Если такой area в HA НЕТ —
# предупреждаем и пропускаем (area создаёт генератор коллеги, мы только назначаем).
areas:
  assign_general: true

# ── Автояркость (恒照) ────────────────────────────────────────────────────────
# Привязку датчик→группа получают ТОЛЬКО помещения перечисленных типов. target_lux — целевая
# освещённость, tol — половина коридора (luxRange = target ± tol).
autobrightness:
  by_space_type:
    class:      { target_lux: 400, tol: 50 }
    recreation: { target_lux: 300, tol: 50 }
    # korridor / hall / special / zal — не заданы → автояркость НЕ привязывается
  # ИСКЛЮЧЕНИЯ (даже если тип подходит): читаем parquet, понимаем объект, потом выкидываем.
  exclude_spaces: []   # подстроки имени помещения: ["105_Актовый", "лаборатория"]
  exclude_floors: []   # этажи целиком: [2, 3]

# ── Кнопочные панели ─────────────────────────────────────────────────────────
# ЛЮБУЮ клавишу можно задать ЯВНО по её номеру (1..8). Ключ 'rest' — для НЕзаданных клавиш выше
# последней явной (заполняет зонами помещения по порядку).
#   press / hold  — действие на нажатие / удержание. Доступно:
#       on      — включить          off  — выключить        toggle — переключить
#       up      — плавно ярче (удерж) down — плавно темнее (удерж)   (не указывать = нет действия)
#   target        — какую группу целит клавиша:
#       room        — общая группа помещения панели
#       zone        — СВОЯ зона панели (из таблицы)
#       zone1..zoneN— N-я зона помещения (по порядку в таблице)
#       zone_by_order — только для 'rest': зоны помещения по порядку
panels:
  layout:                                              # значения в КАВЫЧКАХ: YAML читает on/off как булевы
    1: { press: "on",     hold: "up",   target: "room" }   # ВКЛ помещение + плавно ярче
    2: { press: "off",    hold: "down", target: "room" }   # ВЫКЛ помещение + плавно темнее
    rest: { press: "toggle", target: "zone_by_order" }     # клавиши 3..N → переключатели зон по порядку
