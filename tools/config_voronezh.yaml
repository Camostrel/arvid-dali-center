# Конфиг автопусконаладки — ОБЪЕКТ «школа №45, Воронеж».
#
# Задача этого прогона (решение пользователя 2026-08-10): создать DALI-группы и раздать
# ПРОСТРАНСТВА. Автояркость и привязки кнопок пользователь настраивает сам — здесь выключены,
# чтобы скрипт их не трогал даже случайно.
#
# Разбор объекта, карта имён и «опасные» — docs/VORONEZH_MIGRATION.md.
# Общий конфиг-образец с пояснениями — tools/config_project.yaml.

ha:
  url: "ws://localhost:8123/api/websocket"

general_groups:
  create: true               # общие группы помещений — нужны (на них ярлык ba_room_light)
  skip_if_single_zone: false  # ⚠ 2026-08-12: общая группа нужна КАЖДОМУ пространству,
                             #   даже если зона в нём одна — общими группами управляет
                             #   СТОРОННЯЯ интеграция (ярлык `ba_area_light`), и
                             #   пространство без общей группы для неё дыра.

  # ⚠ РЕШЕНИЕ 2026-08-13: общие группы ТОЛЬКО у рекреаций — на них вешается автояркость,
  #   и «весь свет помещения» там осмыслен. Коридоры, лестницы, залы управляются ЗОНАМИ.
  #   Пустой список вернул бы общие всем типам. Типы объекта: korridor(37), recreation(16),
  #   zal(4), hall(3), special(5).
  only_space_types: [recreation]

areas:
  assign_general: true       # область общим группам
  assign_zone: true          # ⚠ и ЗОННЫМ тоже (решение 2026-08-10): без области зонную группу
                             #   не найти ни фильтром, ни адресацией сервисов «по области»
  create_missing: true       # отсутствующую область создаём (имя = `space` проекта КАК ЕСТЬ,
                             #   напр. «512_Коридор») — 65 имён руками заводить незачем

# ⛔ Автояркость — ВЫКЛЮЧЕНА: настраивает пользователь.
#    Пустой by_space_type = плана нет, фаза autobright ничего не делает.
autobrightness:
  by_space_type: {}
  exclude_spaces: []
  exclude_floors: []

# ⛔ Привязки кнопок — ВЫКЛЮЧЕНЫ: настраивает пользователь («кнопка на всё помещение»
#    разбирается отдельно). Пустой layout = ни одна ячейка панели не трогается.
panels:
  layout: {}
