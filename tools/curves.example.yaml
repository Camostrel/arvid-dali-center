# Кривые мощности драйверов — таблица «яркость → ватты», снятая на объекте.
#
# КУДА ПОЛОЖИТЬ: /config/arvid_curves/curves.yaml
# (файл ВИДИМЫЙ, правится в File Editor / Studio Code Server — его заполняет человек).
# Перечитать без рестарта HA: кнопка в карточке (панель → Энергия → «Перечитать кривые»).
#
# ЗАЧЕМ. Мощность лампы НЕ пропорциональна яркости: ниже ~30% драйвер потребляет своё,
# и линейная модель врёт (на боевом замере 2026-07-13 на 10% завышала на +34%). Кабинеты
# на автояркости живут как раз на низах, поэтому кривая нужна ради них.
#
# КАК СНИМАТЬ (методика — docs/ENERGY_CALC_MODEL.md §5):
#   • мерить МГНОВЕННУЮ мощность ваттметром/реле на каждом уровне яркости, а НЕ энергию за
#     прогон: счётчик Вт·ч квантован тиками 0.2–0.4 Вт·ч и на коротком окне даёт 6–8 %
#     ложной «ошибки модели» (уже попадались, чуть не переписали верную кривую);
#   • уровни задавать НАШИМ ползунком яркости, не из DALI Center — у него «проценты» свои;
#   • обязательно снять НИЗЫ (10 %, 20 %, 30 %) — там вся нелинейность.
#
# ФОРМАТ: точки пишутся в тех единицах, в которых меряете, — «яркость % : ватты».
# Нормировку в доли делает интеграция, пересчитывать руками ничего не нужно.

curves:

  # ── Тип 1: большие светильники ───────────────────────────────────────────────
  big:
    label: "Большие светильники"
    full_w: 60.0          # ватты при 100 %. Можно не указывать — возьмём максимум точек
    standby_w: 0.0        # ватты при ВЫКЛЮЧЕННОЙ лампе (дежурное потребление драйвера)
    source: "ваттметр на объекте, 2026-__-__"
    points:
      10: 5.2
      20: 12.4
      30: 18.1
      50: 30.2
      100: 60.0

  # ── Тип 2: маленькие светильники ─────────────────────────────────────────────
  small:
    label: "Маленькие светильники"
    full_w: 18.0
    standby_w: 0.0
    source: "ваттметр на объекте, 2026-__-__"
    points:
      10: 1.6
      20: 3.9
      30: 5.5
      50: 9.1
      100: 18.0

# ⚠ После правки файла: «Перечитать кривые» в карточке → затем назначить кривую лампам
#   (панель → Энергия → отметить лампы → выбрать кривую и мощность → применить).
#   Кривая сама по себе ничего не меняет: у лампы должна быть задана `power_w`.
#
# ⚠ Имена `linear` и `lbs` заняты встроенными. Если назвать кривую так же, файл победит,
#   но в журнале появится предупреждение — чтобы подмена не прошла незаметно.
